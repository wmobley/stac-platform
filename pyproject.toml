[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stac-platform"
version = "0.1.0"
description = "Project-agnostic STAC API beside CKAN, plus the CKAN+STAC dual-write publish core."
requires-python = ">=3.9"
# Runtime deps for the *publish* path (what a Workflows FunctionTask installs):
# the STAC API/bridge pull their heavier deps from requirements-api.txt.
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
stac-publish = "stacmap.publish:main"

[tool.setuptools]
# The reusable library. A Workflows FunctionTask only needs `stacmap`;
# bridge/stac_api/pgstac are included so `pip install` of the repo is whole.
packages = ["stacmap", "bridge", "stac_api", "pgstac"]

[tool.pytest.ini_options]
# The fast suite (test_context / test_mapping / test_ckan_client / test_stac_client /
# test_geocode) is hermetic — pure builders + stubbed clients, no DB/network — and is
# the CI gate. test_geocode.py mocks Nominatim via httpx.MockTransport; it never hits
# the live endpoint.
# test_publish_pipelines.py is a __main__ script (no pytest test fns) needing a live
# STAC API; run it by hand (see its header). The `integration` marker is reserved
# for any pytest-style test that needs a running service.
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: needs a live external service (STAC API / CKAN) — not in the fast CI gate",
]
